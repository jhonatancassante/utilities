<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="Você está sendo redirecionado para o gerador de QR Code."
		/>
		<meta name="theme-color" content="#16305a" />
		<title>Redirecionando - Gerador de QR Code</title>
		<script>
			(function () {
				const theme = localStorage.getItem('theme') || 'light';
				document.documentElement.setAttribute('data-theme', theme);
			})();
		</script>
		<link rel="icon" type="image/png" href="../assets/favicon.png" />
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="../assets/apple-touch-icon.png"
		/>
		<script src="../js/global.js" defer></script>
		<script>
			document.addEventListener('DOMContentLoaded', function () {
				const targetUrl = 'https://jhonatancassante.com.br/tools/qr-code';
				let countdown = 5; // Tempo em segundos antes do redirecionamento

				const countdownEl = document.getElementById('countdown');
				const redirectLinkEl = document.getElementById('redirect-link');

				redirectLinkEl.href = targetUrl;

				const timer = setInterval(function () {
					countdown--;
					if (countdownEl) {
						countdownEl.textContent = countdown;
					}
					if (countdown <= 0) {
						clearInterval(timer);
						window.location.href = targetUrl;
					}
				}, 1000);
			});
		</script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
		/>
		<link rel="stylesheet" href="../css/global.css" />
		<style>
			.redirect-box {
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 20px;
				padding: 40px 20px;
				text-align: center;
			}
			.redirect-box i {
				font-size: 3rem;
				color: var(--accent);
			}
			.redirect-box p {
				font-size: 1.1rem;
				color: var(--text-secondary);
				line-height: 1.5;
				margin: 0;
			}
			.redirect-box a.btn-redirect {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				gap: 10px;
				background-color: var(--accent);
				color: #ffffff;
				text-decoration: none;
				padding: 12px 24px;
				border-radius: var(--radius-md);
				font-weight: 600;
				font-size: 16px;
				transition:
					background-color var(--transition-fast),
					transform var(--transition-fast);
			}
			.redirect-box a.btn-redirect:hover {
				background-color: var(--accent-hover);
				transform: translateY(-2px);
			}
		</style>
	</head>
	<body>
		<header>
			<div class="header-content">
				<a
					href="../index.html"
					class="back-btn"
					title="Voltar ao menu"
					aria-label="Voltar ao menu"
				>
					<i class="fas fa-arrow-left"></i>
				</a>
				<i class="fas fa-qrcode"></i>
				<h1>Gerador QR Code</h1>
				<button
					id="themeToggleBtn"
					class="theme-toggle-btn"
					title="Alternar tema"
					aria-label="Alternar entre tema claro e escuro"
				>
					<i id="themeIcon" class="fas fa-moon"></i>
				</button>
			</div>
		</header>

		<main>
			<div class="content-wrapper">
				<div class="redirect-box">
					<i class="fas fa-external-link-alt"></i>
					<h1>
						Você será redirecionado em <span id="countdown">5</span> segundos...
					</h1>
					<p>
						Estamos direcionando você para a nova versão da ferramenta em nosso
						site oficial.
					</p>
					<a id="redirect-link" href="#" class="btn-redirect">
						<i class="fas fa-arrow-right"></i> Ir agora para o QR Code
					</a>
				</div>
			</div>
		</main>

		<footer>
			<div class="social-links">
				<a
					href="https://github.com/jhonatancassante"
					target="_blank"
					rel="noopener"
					aria-label="GitHub de Jhonatan Cassante"
				>
					<i class="fab fa-github"></i>
				</a>
				<a
					href="https://www.instagram.com/jhonatancassante/"
					target="_blank"
					rel="noopener"
					aria-label="Instagram de Jhonatan Cassante"
				>
					<i class="fab fa-instagram"></i>
				</a>
			</div>
			<div class="copyright">
				© 2026 Jhonatan Cassante. Todos os direitos reservados.
			</div>
			<a
				href="https://www.flaticon.com/br/icones-gratis/servicos-de-utilidade-publica"
				title="serviços de utilidade pública ícones"
				class="attribution"
				target="_blank"
				rel="noopener"
			>
				Ícones por Maan Icons - Flaticon
			</a>
		</footer>
	</body>
</html>
