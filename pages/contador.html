<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="Contagem regressiva em tempo real: quantos dias, horas, minutos e segundos faltam para o evento."
		/>
		<meta name="theme-color" content="#16305a" />
		<title>Contagem Regressiva - Utilitários</title>
		<script>
			(function () {
				const theme = localStorage.getItem('theme') || 'light';
				document.documentElement.setAttribute('data-theme', theme);
			})();
		</script>
		<link rel="icon" type="image/png" href="../assets/favicon.png" />
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="../assets/apple-touch-icon.png"
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
		/>
		<link rel="stylesheet" href="../css/global.css" />
		<link rel="stylesheet" href="../css/contador.css" />
		<script src="../js/global.js" defer></script>
		<script src="../js/contador.js" defer></script>
	</head>
	<body>
		<header>
			<div class="header-content">
				<a
					href="../index.html"
					class="back-btn"
					title="Voltar ao menu"
					aria-label="Voltar ao menu"
				>
					<i class="fas fa-arrow-left"></i>
				</a>
				<i class="fas fa-hourglass-half"></i>
				<h1>Contagem Regressiva</h1>
				<button
					id="themeToggleBtn"
					class="theme-toggle-btn"
					title="Alternar tema"
					aria-label="Alternar entre tema claro e escuro"
				>
					<i id="themeIcon" class="fas fa-moon"></i>
				</button>
			</div>
		</header>

		<main>
			<div class="content-wrapper countdown-card">
				<p class="countdown-eyebrow">Falta pouco para</p>
				<h1 id="eventName" class="countdown-title">Evento</h1>

				<div class="event-meta">
					<span class="event-chip">
						<i class="fas fa-calendar-day"></i>
						<span id="eventDate">--/--/----</span>
					</span>
					<span class="event-chip">
						<i class="fas fa-clock"></i>
						<span id="eventTime">--:--</span>
					</span>
				</div>

				<div id="countdown" class="countdown-grid" role="timer" aria-live="off">
					<div class="time-tile">
						<span id="daysValue" class="time-value">--</span>
						<span id="daysLabel" class="time-label">dias</span>
					</div>
					<div class="time-tile">
						<span id="hoursValue" class="time-value">--</span>
						<span id="hoursLabel" class="time-label">horas</span>
					</div>
					<div class="time-tile">
						<span id="minutesValue" class="time-value">--</span>
						<span id="minutesLabel" class="time-label">minutos</span>
					</div>
					<div class="time-tile time-tile-live">
						<span id="secondsValue" class="time-value">--</span>
						<span id="secondsLabel" class="time-label">segundos</span>
					</div>
				</div>

				<p id="countdownSummary" class="countdown-summary"></p>

				<div id="eventStarted" class="event-started" hidden>
					<i class="fas fa-champagne-glasses"></i>
					<strong>O evento já começou!</strong>
				</div>
			</div>
		</main>

		<footer>
			<div class="social-links">
				<a
					href="https://github.com/jhonatancassante"
					target="_blank"
					rel="noopener"
					aria-label="GitHub de Jhonatan Cassante"
				>
					<i class="fab fa-github"></i>
				</a>
				<a
					href="https://www.instagram.com/jhonatancassante/"
					target="_blank"
					rel="noopener"
					aria-label="Instagram de Jhonatan Cassante"
				>
					<i class="fab fa-instagram"></i>
				</a>
			</div>
			<div class="copyright">
				© 2026 Jhonatan Cassante. Todos os direitos reservados.
			</div>
			<a
				href="https://www.flaticon.com/br/icones-gratis/servicos-de-utilidade-publica"
				title="serviços de utilidade pública ícones"
				class="attribution"
				target="_blank"
				rel="noopener"
			>
				Ícones por Maan Icons - Flaticon
			</a>
		</footer>
	</body>
</html>
